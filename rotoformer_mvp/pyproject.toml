[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotoformer"
version = "0.1.0"
description = "Inference-time finite-field rotations for frozen transformer layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.45,<6",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
dev = [
  "pytest>=8",
]

[project.scripts]
rotoformer-sweep = "rotoformer.cli:main"

[tool.setuptools.packages.find]
include = ["rotoformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
